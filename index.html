<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#EEF0F5">
  <title>МИЭТ — мини-приложение университета</title>

  <link rel="stylesheet" href="css/fonts.css?v=257a7fa0">
  <link rel="stylesheet" href="css/tokens.css?v=adccc554">
  <link rel="stylesheet" href="css/app.css?v=a0a20be6">

  <link rel="preload" href="fonts/manrope-700-cyrillic.woff2" as="font"
        type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/manrope-800-cyrillic.woff2" as="font"
        type="font/woff2" crossorigin>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Тема ставится до первой отрисовки. Без этого человек с тёмным
       Telegram видел вспышку белого на каждом открытии: тему применял
       js/app.js, а он грузится после разметки и стилей. -->
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem('miet-app-v1') || '{}');
      var picked = saved.theme && saved.theme !== 'auto' ? saved.theme
        : (window.Telegram && Telegram.WebApp && Telegram.WebApp.colorScheme)
          || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      var dark = picked === 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]')
        .setAttribute('content', dark ? '#0F1014' : '#EEF0F5');
    } catch (e) { /* приватный режим — останется светлая */ }
  </script>

  <!-- карта модулей -->
  <!-- Собрано tools/stamp.py: подменяет адрес каждому модулю разом,
       чтобы выкладка доходила до людей, а не лежала в кеше. -->
  <script type="importmap">
  {
    "imports": {
      "./js/api.js": "./js/api.js?v=65027e32",
      "./js/app.js": "./js/app.js?v=65027e32",
      "./js/config.js": "./js/config.js?v=65027e32",
      "./js/icons.js": "./js/icons.js?v=65027e32",
      "./js/router.js": "./js/router.js?v=65027e32",
      "./js/schedule.js": "./js/schedule.js?v=65027e32",
      "./js/screens/about.js": "./js/screens/about.js?v=65027e32",
      "./js/screens/admin-days.js": "./js/screens/admin-days.js?v=65027e32",
      "./js/screens/admin.js": "./js/screens/admin.js?v=65027e32",
      "./js/screens/campus.js": "./js/screens/campus.js?v=65027e32",
      "./js/screens/clubs.js": "./js/screens/clubs.js?v=65027e32",
      "./js/screens/common.js": "./js/screens/common.js?v=65027e32",
      "./js/screens/community.js": "./js/screens/community.js?v=65027e32",
      "./js/screens/feed.js": "./js/screens/feed.js?v=65027e32",
      "./js/screens/guide.js": "./js/screens/guide.js?v=65027e32",
      "./js/screens/help.js": "./js/screens/help.js?v=65027e32",
      "./js/screens/home.js": "./js/screens/home.js?v=65027e32",
      "./js/screens/institutes.js": "./js/screens/institutes.js?v=65027e32",
      "./js/screens/links.js": "./js/screens/links.js?v=65027e32",
      "./js/screens/news.js": "./js/screens/news.js?v=65027e32",
      "./js/screens/profile.js": "./js/screens/profile.js?v=65027e32",
      "./js/screens/schedule.js": "./js/screens/schedule.js?v=65027e32",
      "./js/screens/search.js": "./js/screens/search.js?v=65027e32",
      "./js/screens/support.js": "./js/screens/support.js?v=65027e32",
      "./js/screens/tasks.js": "./js/screens/tasks.js?v=65027e32",
      "./js/screens/teachers.js": "./js/screens/teachers.js?v=65027e32",
      "./js/screens/tools.js": "./js/screens/tools.js?v=65027e32",
      "./js/screens/useful.js": "./js/screens/useful.js?v=65027e32",
      "./js/store.js": "./js/store.js?v=65027e32",
      "./js/tg.js": "./js/tg.js?v=65027e32",
      "./js/ui.js": "./js/ui.js?v=65027e32"
    }
  }
  </script>

  <!-- Модули без сборки грузятся каскадом: app.js → экраны → ui и
       icons, и каждая ступень стоит целого круга по сети.
       Предзагрузка ставит весь горячий путь в одну волну. -->
  <link rel="modulepreload" href="js/app.js?v=65027e32">
  <link rel="modulepreload" href="js/router.js?v=65027e32">
  <link rel="modulepreload" href="js/store.js?v=65027e32">
  <link rel="modulepreload" href="js/ui.js?v=65027e32">
  <link rel="modulepreload" href="js/icons.js?v=65027e32">
  <link rel="modulepreload" href="js/tg.js?v=65027e32">
  <link rel="modulepreload" href="js/api.js?v=65027e32">
  <link rel="modulepreload" href="js/config.js?v=65027e32">
  <link rel="modulepreload" href="js/schedule.js?v=65027e32">
  <link rel="modulepreload" href="js/screens/common.js?v=65027e32">
  <link rel="modulepreload" href="js/screens/home.js?v=65027e32">
  <link rel="modulepreload" href="js/screens/schedule.js?v=65027e32">
  <link rel="modulepreload" href="js/screens/feed.js?v=65027e32">
  <!-- /карта модулей -->
</head>
<body>
  <div id="app">
    <div class="boot">
      <div class="boot-logo">МИЭТ</div>
      <div class="boot-spinner"></div>
    </div>
  </div>

  <nav id="nav" class="bottom-nav" hidden></nav>
  <div id="layer"></div>

  <!-- точка входа -->
  <!-- Через import, а не src: так адрес точки входа тоже проходит
       через карту выше и обновляется вместе со всем деревом. -->
  <script type="module">import './js/app.js';</script>
  <!-- /точка входа -->
</body>
</html>
