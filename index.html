<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#EEF0F5">
  <title>МИЭТ — мини-приложение университета</title>

  <link rel="stylesheet" href="css/fonts.css?v=257a7fa0">
  <link rel="stylesheet" href="css/tokens.css?v=adccc554">
  <link rel="stylesheet" href="css/app.css?v=3dcaed8e">

  <link rel="preload" href="fonts/manrope-700-cyrillic.woff2" as="font"
        type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/manrope-800-cyrillic.woff2" as="font"
        type="font/woff2" crossorigin>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Тема ставится до первой отрисовки. Без этого человек с тёмным
       Telegram видел вспышку белого на каждом открытии: тему применял
       js/app.js, а он грузится после разметки и стилей. -->
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem('miet-app-v1') || '{}');
      var picked = saved.theme && saved.theme !== 'auto' ? saved.theme
        : (window.Telegram && Telegram.WebApp && Telegram.WebApp.colorScheme)
          || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      var dark = picked === 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]')
        .setAttribute('content', dark ? '#0F1014' : '#EEF0F5');
    } catch (e) { /* приватный режим — останется светлая */ }
  </script>

  <!-- карта модулей -->
  <!-- Приложение собрано в один файл (tools/stamp.py): те же
       модули, но одним походом по сети вместо тридцати двух.
       Исходники лежат рядом и остаются модулями — правят их. -->
  <link rel="modulepreload" href="js/bundle.js?v=417bc129">
  <!-- /карта модулей -->
</head>
<body>
  <div id="app">
    <div class="boot">
      <div class="boot-logo">МИЭТ</div>
      <div class="boot-spinner"></div>
    </div>
  </div>

  <nav id="nav" class="bottom-nav" hidden></nav>
  <div id="layer"></div>

  <!-- точка входа -->
  <script type="module" src="js/bundle.js?v=417bc129"></script>
  <!-- Сборка не выполнилась — подключаем исходные модули:
       белый экран хуже лишнего запроса. -->
  <script>
    setTimeout(function () {
      if (window.__mietBooted) return;
      var s = document.createElement('script');
      s.type = 'module';
      s.src = 'js/app.js?v=417bc129';
      document.body.appendChild(s);
    }, 2000);
  </script>
  <!-- /точка входа -->
</body>
</html>
