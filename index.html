<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#EEF0F5">
  <title>МИЭТ — мини-приложение университета</title>

  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">

  <link rel="preload" href="fonts/manrope-700-cyrillic.woff2" as="font"
        type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/manrope-800-cyrillic.woff2" as="font"
        type="font/woff2" crossorigin>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Тема ставится до первой отрисовки. Без этого человек с тёмным
       Telegram видел вспышку белого на каждом открытии: тему применял
       js/app.js, а он грузится после разметки и стилей. -->
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem('miet-app-v1') || '{}');
      var picked = saved.theme && saved.theme !== 'auto' ? saved.theme
        : (window.Telegram && Telegram.WebApp && Telegram.WebApp.colorScheme)
          || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      var dark = picked === 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]')
        .setAttribute('content', dark ? '#0F1014' : '#EEF0F5');
    } catch (e) { /* приватный режим — останется светлая */ }
  </script>

  <!-- Модули без сборки грузятся каскадом: app.js → экраны → ui и icons,
       и каждая ступень стоит целого круга по сети. Предзагрузка ставит
       весь горячий путь в одну волну; остальные экраны подтянутся сами. -->
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/router.js">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/icons.js">
  <link rel="modulepreload" href="js/tg.js">
  <link rel="modulepreload" href="js/api.js">
  <link rel="modulepreload" href="js/config.js">
  <link rel="modulepreload" href="js/schedule.js">
  <link rel="modulepreload" href="js/screens/common.js">
  <link rel="modulepreload" href="js/screens/home.js">
  <link rel="modulepreload" href="js/screens/schedule.js">
  <link rel="modulepreload" href="js/screens/feed.js">
</head>
<body>
  <div id="app">
    <div class="boot">
      <div class="boot-logo">МИЭТ</div>
      <div class="boot-spinner"></div>
    </div>
  </div>

  <nav id="nav" class="bottom-nav" hidden></nav>
  <div id="layer"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
